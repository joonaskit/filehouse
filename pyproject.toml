[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filehouse"
version = "0.1.0a1"
description = "A small file browser for KDE Plasma, companion to Quickshell Island"
readme = "README.md"
requires-python = ">=3.12"
# PySide6 and PyGObject come from the distribution (python3-pyside6,
# python3-gobject), so they share one GLib event loop. See CLAUDE.md.
# libarchive-c (python3-libarchive-c) is optional: archives need it.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]

[project.scripts]
filehouse = "filehouse.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filehouse = ["integration/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, import sorting
select = ["F", "E", "W", "B", "I"]
# gi.require_version has to run before the gi.repository imports
ignore = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# The usual default for a model's `parent` argument
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]
