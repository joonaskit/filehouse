[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filehouse"
version = "0.1.0"
description = "Modern Python and Qt File Browser Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
]

[project.scripts]
filehouse = "filehouse.app:main"
